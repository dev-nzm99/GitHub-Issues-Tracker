<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Github-Issue-Tracker</title>

  <link rel="stylesheet" href="./style.css" />

  <!-- fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet" />

  <!-- tailwindcss + daisyui -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- font awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="bg-slate-100">
  <header>
    <div class="navbar bg-base-100 shadow-sm flex justify-between px-14">
      <div class="flex gap-2 items-center">
        <img src="./assets/github-logo.png" style="width:40px;height:40px" alt="GitHub Logo">
        <h1 class="text-2xl font-bold">GitHub Issues Tracker</h1>
      </div>

      <div class="flex gap-2">
        <input id="search-input" type="text" placeholder="Search Issues..."
          class="input input-bordered w-24 md:w-auto" />

        <button class="btn btn-primary">
          <i class="fa-solid fa-plus"></i>
          New Issue
        </button>
      </div>
    </div>
  </header>

  <!-- filter buttons -->
  <section class="pt-[60px]">
    <div class="flex gap-2 w-[70%] shadow-md p-4 mx-auto rounded-t-[8px] bg-white">
      <button id="btn-all" onclick="filterIssues('all')" class="btn bg-blue-500 text-white border-none">
        All
      </button>

      <button id="btn-open" onclick="filterIssues('open')" class="btn bg-white text-black">
        Open
      </button>

      <button id="btn-closed" onclick="filterIssues('closed')" class="btn bg-white text-black">
        Closed
      </button>
    </div>

    <!-- issues section -->
    <div class="mt-3 w-[70%] shadow-md p-4 mx-auto rounded-t-[8px] bg-white">
      <div class="flex justify-between bg-base-100">
        <div class="flex items-center gap-[6px]">
          <div class="pt-[10px]">
            <img src="./assets/Aperture.png" alt="Aperture">
          </div>

          <div>
            <h1 id="issue-count" class="font-bold text-[24px]">0 Issues</h1>
            <p class="text-[16px]">Track and manage your project issues</p>
          </div>
        </div>

        <div class="flex items-center gap-6 text-sm font-medium">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
            <span class="text-gray-600">Open</span>
          </div>

          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-purple-500"></span>
            <span class="text-gray-600">Closed</span>
          </div>
        </div>
      </div>

      <!-- loading spinner -->
      <div id="loader" class="hidden flex flex-col justify-center items-center py-12">
        <span class="loading loading-spinner loading-lg text-primary"></span>
        <p class="mt-3 text-sm text-slate-500">Loading issues...</p>
      </div>

      <!-- list of issues -->
      <div id="issues-list" class="flex flex-wrap gap-4 mt-4 pl-2"></div>
    </div>
  </section>

  <!-- issue modal -->
  <div id="issue-modal"
    class="fixed inset-0 bg-black/30 hidden items-center justify-center z-50 px-4">
    <div class="bg-white w-full max-w-[580px] rounded-xl shadow-2xl p-6 relative">

      <!-- modal loading -->
      <div id="modal-loader" class="hidden py-12 text-center">
        <span class="loading loading-spinner loading-lg text-primary"></span>
        <p class="mt-3 text-sm text-slate-500">Loading issue details...</p>
      </div>

      <!-- modal content -->
      <div id="modal-content"></div>

      <!-- modal footer -->
      <div class="mt-5 flex justify-end">
        <button onclick="closeIssueModal()"
          class="btn btn-sm px-6 bg-[#4f1dff] hover:bg-[#4016d9] text-white border-none">
          Close
        </button>
      </div>
    </div>
  </div>

  <script src="./script/main.js"></script>
</body>

</html>
