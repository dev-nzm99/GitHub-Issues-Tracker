<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Github-Issue-Tracker</title>

  <link rel="stylesheet" href="./style.css" />

  <!-- add fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet" />

  <!-- tailwindcss + daisyui -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
  <header>
    <div class="navbar bg-base-100 shadow-sm flex justify-between px-14">

      <div class="flex gap-2 items-center">
        <img src="./assets/github-logo.png" style="width:40px;height:40px">
        <h1 class="text-2xl font-bold">GitHub Issues Tracker</h1>
      </div>

      <div class="flex gap-2">
        <input id="search-input" type="text" placeholder="Search Issues..."
          class="input input-bordered w-24 md:w-auto" />

        <button class="btn btn-primary">
          <i class="fa-solid fa-plus"></i>
          New Issue
        </button>
      </div>

    </div>
  </header>

  >
  <!-- filter buttons section -->
  <section class="pt-[60px]">

    <div class="flex gap-2 w-[70%] shadow-md p-4 mx-auto rounded-t-[8px]">

      <button id="btn-all" onclick="filterIssues('all')" class="btn bg-blue-500 text-white">
        All
      </button>

      <button id="btn-open" onclick="filterIssues('open')" class="btn bg-white text-black">
        Open
      </button>

      <button id="btn-closed" onclick="filterIssues('closed')" class="btn bg-white text-black">
        Closed
      </button>

    </div>
    <!-- issues section -->
    <div class="mt-3 w-[70%] shadow-md p-4 mx-auto rounded-t-[8px]">

      <div class="flex justify-between bg-base-100">

        <div class="flex align-center gap-[6px]">

          <div class="pt-[10px]">
            <img src="./assets/Aperture.png">
          </div>

          <div>
            <h1 id="issue-count" class="font-bold text-[24px]">0 Issues</h1>
            <p class="text-[16px]">Track and manage your project issues</p>
          </div>

        </div>
        <div class="flex items-center gap-6 text-sm font-medium">

          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
            <span class="text-gray-600">Open</span>
          </div>

          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-purple-500"></span>
            <span class="text-gray-600">Closed</span>
          </div>
        </div>

      </div>
      <!-- list of issues (dynamic) -->
      <div id="issues-list" class="flex flex-wrap gap-4 mt-4 pl-2">
      </div>
    </div>
  </section>

  <script src="./script/index.js"></script>

</body>
</html>
